name: CI/CD

# CI runs here. CD is Render's: it redeploys main once these checks pass (render.yaml).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint (static analysis)
        run: ruff check .
      - name: Unit tests
        run: pytest -m unit
      - name: Integration tests
        run: pytest -m integration
      - name: Model regression tests
        run: pytest -m regression

  docker:
    name: Build and smoke-test the Docker image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker build -t leaflens .
      - name: Start the app and wait for it to answer
        run: |
          docker run -d --name leaflens -p 10000:10000 leaflens
          for attempt in $(seq 1 60); do
            if curl -sf http://localhost:10000/api/health; then exit 0; fi
            sleep 2
          done
          docker logs leaflens
          exit 1
      - name: Diagnose a photo through the running app
        run: |
          docker exec leaflens python -c "from PIL import Image; Image.new('RGB', (3000, 4000), (60, 140, 60)).save('/tmp/leaf.jpg')"
          docker cp leaflens:/tmp/leaf.jpg leaf.jpg
          curl -sf -F "image=@leaf.jpg" http://localhost:10000/api/predict | tee response.json
          grep -q '"prediction"' response.json
      - name: Check it fits Render's free 512 MB instance
        run: |
          usage=$(docker stats --no-stream --format '{{.MemUsage}}' leaflens | cut -d/ -f1)
          echo "::notice title=Container memory::$usage after diagnosing a 12-megapixel photo (limit for this check: 400MiB)"
          python3 -c "
          import re, sys
          value, unit = re.match(r'([\d.]+)\s*(\w+)', '$usage').groups()
          mib = float(value) * {'KiB': 1 / 1024, 'MiB': 1, 'GiB': 1024}[unit]
          sys.exit(f'Uses {mib:.0f} MiB; Render free instances have 512 MB') if mib > 400 else None
          "
