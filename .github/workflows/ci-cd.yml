name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest

  docker:
    name: Build and smoke-test the Docker image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker build -t leaflens .
      - name: Start the app and wait for it to answer
        run: |
          docker run -d --name leaflens -p 7860:7860 leaflens
          for attempt in $(seq 1 60); do
            if curl -sf http://localhost:7860/api/health; then exit 0; fi
            sleep 2
          done
          docker logs leaflens
          exit 1
      - name: Diagnose a photo through the running app
        run: |
          docker exec leaflens python -c "from PIL import Image; Image.new('RGB', (300, 300), (60, 140, 60)).save('/tmp/leaf.jpg')"
          docker cp leaflens:/tmp/leaf.jpg leaf.jpg
          curl -sf -F "image=@leaf.jpg" http://localhost:7860/api/predict | tee response.json
          grep -q '"prediction"' response.json

  deploy:
    name: Deploy to Hugging Face Spaces
    needs: docker
    # Runs on pushes to main once the HF_SPACE variable is set (Settings > Secrets and variables > Actions).
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.HF_SPACE != ''
    runs-on: ubuntu-latest
    environment:
      name: huggingface
      url: https://huggingface.co/spaces/${{ vars.HF_SPACE }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Install the Hugging Face client
        run: pip install "huggingface_hub==2.*"
      - name: Upload the app to the Space
        run: python deploy/deploy_space.py "$HF_SPACE" --message "Deploy ${GITHUB_SHA::7} from GitHub"
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
