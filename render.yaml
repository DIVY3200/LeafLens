# Render Blueprint for the LeafLens web app (https://render.com/docs/blueprint-spec).
# Render builds the Dockerfile and redeploys main after the GitHub Actions checks pass.
services:
  - type: web
    name: leaflens
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
