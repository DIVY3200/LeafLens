[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "unit: one function or module in isolation (no model loaded)",
    "integration: components working together, e.g. the web API with a real model",
    "regression: the shipped models still load, match their cards and agree with each other",
]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["Dataset", "data"]

[tool.ruff.lint]
# Ruff's default rule set: syntax errors, undefined names, unused imports and variables.
select = ["E4", "E7", "E9", "F"]
