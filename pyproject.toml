[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["Dataset", "data"]

[tool.ruff.lint]
# Ruff's default rule set: syntax errors, undefined names, unused imports and variables.
select = ["E4", "E7", "E9", "F"]
